user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;

    server {
        listen 80;
        server_name maojike.me www.maojike.me;
        return 301 https://maojike.me$request_uri;
    }

    server {
        listen 443 ssl;
        server_name www.maojike.me;

        ssl_certificate /etc/letsencrypt/live/maojike.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/maojike.me/privkey.pem;

        return 301 https://maojike.me$request_uri;
    }

    server {
        listen 443 ssl;
        server_name maojike.me;

        ssl_certificate /etc/letsencrypt/live/maojike.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/maojike.me/privkey.pem;

        root /var/www/resume-website/portal/dist;
        index index.html;

        # 3D 模型文件长期缓存（文件名不变则内容不变）
        location ~* \.(glb|gltf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 子应用静态资源 (resume / dashboard)
        location /subapps/ {
            alias /var/www/resume-website/portal/dist/subapps/;
            try_files $uri $uri/ =404;
            add_header Access-Control-Allow-Origin *;
        }

        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            alias /var/www/resume-website/admin/dist/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
